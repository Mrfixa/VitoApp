name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-rider-apk:
    name: Build Rider APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: stable

      - name: Get dependencies
        working-directory: VitoRider/HexaRide-User-app-release-3.1
        run: flutter pub get

      - name: Build APK
        working-directory: VitoRider/HexaRide-User-app-release-3.1
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload rider APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vito-rider-apk
          path: VitoRider/HexaRide-User-app-release-3.1/build/app/outputs/flutter-apk/app-release.apk

  build-driver-apk:
    name: Build Driver APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: stable

      - name: Get dependencies
        working-directory: VitoDriver/HexaRide-Driver-app-release-3.1
        run: flutter pub get

      - name: Build APK
        working-directory: VitoDriver/HexaRide-Driver-app-release-3.1
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload driver APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vito-driver-apk
          path: VitoDriver/HexaRide-Driver-app-release-3.1/build/app/outputs/flutter-apk/app-release.apk

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-rider-apk, build-driver-apk]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download rider APK
        uses: actions/download-artifact@v4
        with:
          name: vito-rider-apk
          path: artifacts/rider

      - name: Download driver APK
        uses: actions/download-artifact@v4
        with:
          name: vito-driver-apk
          path: artifacts/driver

      - name: Rename APKs
        run: |
          mv artifacts/rider/app-release.apk artifacts/vito-rider-${{ github.ref_name }}.apk
          mv artifacts/driver/app-release.apk artifacts/vito-driver-${{ github.ref_name }}.apk

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: "Vito ${{ github.ref_name }}"
          body: |
            ## Vito ${{ github.ref_name }}

            ### What's included
            - **Vito Rider** — Customer ride-sharing app (Android APK)
            - **Vito Driver** — Driver app with QR invite, mart delivery, face verification (Android APK)

            ### Backend
            - Laravel 12 modular monolith — 16 active modules
            - PIN-based auth (6-digit, bcrypt, lockout protection)
            - QR invitation token system with referral tracking
            - Real-time ride tracking via Laravel Reverb (WebSocket)
            - Mart/marketplace delivery with atomic stock management
            - Wallet system with negative-balance guard

            ### Security
            - JWT stored in FlutterSecureStorage (migrated from SharedPreferences)
            - OTP auth disabled (PIN-only flow)
            - All admin mutations audit-logged

            ### Installation
            Download the APK for your device type and install (enable "Install from unknown sources" if needed).
          files: |
            artifacts/vito-rider-${{ github.ref_name }}.apk
            artifacts/vito-driver-${{ github.ref_name }}.apk
          draft: false
          prerelease: false
