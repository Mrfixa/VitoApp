name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  php-lint:
    name: PHP Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Check PHP syntax
        run: find vito -name "*.php" -not -path "*/vendor/*" -print0 | xargs -0 -n1 php -l

  pubspec-validate:
    name: Validate pubspec.yaml files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: stable

      - name: Validate rider pubspec
        working-directory: VitoRider/HexaRide-User-app-release-3.1
        run: flutter pub get

      - name: Validate driver pubspec
        working-directory: VitoDriver/HexaRide-Driver-app-release-3.1
        run: flutter pub get

  flutter-analyze:
    name: Flutter Analyze
    runs-on: ubuntu-latest
    needs: pubspec-validate
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: stable

      - name: Analyze rider app
        working-directory: VitoRider/HexaRide-User-app-release-3.1
        run: flutter pub get && flutter analyze --no-fatal-infos

      - name: Analyze driver app
        working-directory: VitoDriver/HexaRide-Driver-app-release-3.1
        run: flutter pub get && flutter analyze --no-fatal-infos
